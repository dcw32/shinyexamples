<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Calder Island Cat Lab</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=IBM+Plex+Mono:wght@400;500&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: guide strip on top, chart-framed island map on the left, instrument panel (KPIs, who pays, tabs) on the right. */
:root{
  --bg:#e8edf1; --panel:#fbfcfd; --panel2:#eff3f6; --ink:#101e2a; --mut:#53636f; --line:#d0dae1; --line2:#e2e9ee;
  --accent:#0a7885; --accent-ink:#ffffff; --accent-soft:#d5ecef;
  --good:#1b7f45; --bad:#bf3b2c; --warn:#b77712;
  --sea:#d2e3ee; --grid:#b9cedc; --land-lo:#dce6cb; --land-hi:#a5b690; --coast:#587862; --frame:#c3d2dc; --halo:#ffffffd9; --ring:#ffffff;
  --t-timber:#8a55d8; --t-masonry:#12917e; --t-commercial:#e0a106; --t-industrial:#3a475a;
  --t-port:#0f4c81; --t-refinery:#b4432b; --t-power:#b0237a;
  --c-ded:#9fb0bd; --c-over:#d89a3a; --c-coin:#7f8fd0;
  --wind:#5b6be0; --slide:#d9622b;
  --font-d:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-b:'Public Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-m:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0a121a; --panel:#101b25; --panel2:#16232f; --ink:#e5edf3; --mut:#93a6b5; --line:#243747; --line2:#1b2c3a;
  --accent:#4cc3cc; --accent-ink:#06222a; --accent-soft:#123941;
  --good:#5fd08a; --bad:#ff7f6e; --warn:#e6b04a;
  --sea:#0d2234; --grid:#17324a; --land-lo:#25392f; --land-hi:#4a6552; --coast:#86aa92; --frame:#0b1822; --halo:#0d1620d9; --ring:#0f1a24;
  --t-timber:#b690f2; --t-masonry:#3fd1b9; --t-commercial:#f2c04a; --t-industrial:#9fb2c8;
  --t-port:#6fb0ee; --t-refinery:#f08b6e; --t-power:#ee77c0;
  --c-ded:#5d7284; --c-over:#e0a64a; --c-coin:#8f9de6;
  --wind:#8d9bff; --slide:#ff9a62; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0a121a; --panel:#101b25; --panel2:#16232f; --ink:#e5edf3; --mut:#93a6b5; --line:#243747; --line2:#1b2c3a;
  --accent:#4cc3cc; --accent-ink:#06222a; --accent-soft:#123941;
  --good:#5fd08a; --bad:#ff7f6e; --warn:#e6b04a;
  --sea:#0d2234; --grid:#17324a; --land-lo:#25392f; --land-hi:#4a6552; --coast:#86aa92; --frame:#0b1822; --halo:#0d1620d9; --ring:#0f1a24;
  --t-timber:#b690f2; --t-masonry:#3fd1b9; --t-commercial:#f2c04a; --t-industrial:#9fb2c8;
  --t-port:#6fb0ee; --t-refinery:#f08b6e; --t-power:#ee77c0;
  --c-ded:#5d7284; --c-over:#e0a64a; --c-coin:#8f9de6;
  --wind:#8d9bff; --slide:#ff9a62; color-scheme:dark;}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--font-b);-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,h4,p{margin:0}
.num,.mono{font-family:var(--font-m);font-variant-numeric:tabular-nums}

#app{height:100%;display:grid;grid-template-rows:auto auto minmax(0,1fr);gap:10px;padding-inline:16px;padding-block:10px}

/* ---- top bar ---- */
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg{flex:none;color:var(--accent)}
.brand h1{font:700 19px/1 var(--font-d);letter-spacing:-.01em}
.brand p{font-size:11.5px;color:var(--mut);margin-top:3px}
.steps{display:flex;flex-wrap:wrap;align-items:center;gap:6px;flex:1 1 380px;min-width:0}
.phase{font:600 10.5px/1 var(--font-b);letter-spacing:.09em;text-transform:uppercase;color:var(--mut);margin-right:2px}
.phase.gap{margin-left:12px}
.step{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 12px 5px 6px;font-weight:600;font-size:13px}
.step .n{display:grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--panel2);font:600 11px var(--font-m);color:var(--mut)}
.step[aria-current="step"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.step[aria-current="step"] .n{background:var(--accent);color:var(--accent-ink)}
.step.done .n{background:var(--accent-soft);color:var(--accent)}
.step:disabled{opacity:.6;cursor:not-allowed;border-style:dashed;padding:5px 12px;font-size:12px;font-weight:500;color:var(--mut)}
.nav{display:flex;gap:6px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:6px 12px;font-weight:600;font-size:13px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:3px 9px;font-size:12px}

/* ---- guide ---- */
.guide{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr) minmax(0,1fr) auto;gap:8px 22px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 16px;position:relative;align-items:start}
.guide h2{font:700 19px/1.15 var(--font-d);letter-spacing:-.01em;text-wrap:balance}
.guide .lede{margin-top:5px;color:var(--mut);max-width:62ch;font-size:13px}
.guide h3{font:600 10.5px/1 var(--font-b);letter-spacing:.09em;text-transform:uppercase;color:var(--accent);margin-bottom:6px}
.guide ul{margin:0;padding-left:16px;display:grid;gap:3px;font-size:13px}
.guide .notice{font-size:13px}
.guide .notice b{font-family:var(--font-m);font-weight:500}
.guide[data-c="1"] .lede,.guide[data-c="1"] .try,.guide[data-c="1"] .notice-wrap{display:none}
.guide[data-c="1"]{grid-template-columns:minmax(0,1fr) auto}
.chips-inline{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}

/* ---- stage ---- */
.stage{display:grid;grid-template-columns:minmax(0,1fr) clamp(340px,33vw,430px);gap:12px;min-height:0}
.mapcol{display:flex;flex-direction:column;gap:8px;min-width:0;min-height:0}
.layers{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 11px;font-size:12.5px;font-weight:500;line-height:1.3}
.chip .dot{width:9px;height:9px;border-radius:50%;background:var(--mut);flex:none}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);font-weight:600}
.chip[aria-pressed="true"] .dot{background:var(--accent)}
.chip:hover{border-color:var(--accent)}
.mapwrap{position:relative;flex:1 1 0;min-height:260px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--frame)}
#map{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:manipulation}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);border-radius:7px;padding:6px 9px;font-size:12px;line-height:1.35;max-width:230px;z-index:3;box-shadow:0 4px 14px #0003}
.tip b{font-weight:600}
.legend{position:absolute;right:8px;bottom:8px;display:grid;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 9px;font-size:11px;z-index:2;max-width:210px}
.legend:empty{display:none}
.legend .lg-t{color:var(--mut);margin-bottom:2px}
.legend .bar2{height:8px;border-radius:4px;border:1px solid var(--line)}
.legend .ticks{display:flex;justify-content:space-between;font:10.5px var(--font-m);color:var(--mut);margin-top:2px}
.toast{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:6px 12px;border-radius:7px;font-size:12.5px;z-index:4;pointer-events:none}
.evtag{position:absolute;top:8px;right:8px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px 9px;font-size:12px;z-index:2;max-width:70%}
.evtag b{font-family:var(--font-m);font-weight:500}
.scn{display:grid;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
.scn-top{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.scn-top .lbl,.lbl{font:600 10.5px/1 var(--font-b);letter-spacing:.09em;text-transform:uppercase;color:var(--mut);margin-right:2px}
.sliders{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:6px 18px;align-items:center}
.sl{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center;font-size:12.5px}
.sl .v{font:500 12px var(--font-m);min-width:7ch;text-align:right}
.sl.wide{grid-template-columns:auto minmax(0,1fr) auto auto}
input[type=range]{width:100%;accent-color:var(--accent);margin:0;min-width:0}
.readout{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:12.5px;color:var(--mut)}
.readout b{color:var(--ink);font-family:var(--font-m);font-weight:500}

/* ---- panel ---- */
.panel{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line)}
.kpi{background:var(--panel);padding:9px 11px 8px;min-width:0}
.kpi .k{font:600 10px/1.2 var(--font-b);letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.kpi .val{font:600 22px/1.15 var(--font-m);letter-spacing:-.02em;margin-top:3px;white-space:nowrap}
.kpi .val small{font-size:12px;color:var(--mut);font-weight:400;margin-left:1px}
.kpi .sub{font-size:11px;color:var(--mut);margin-top:1px;min-height:15px}
.kpi .d{font:500 11px var(--font-m);margin-top:2px;min-height:15px}
.d.up{color:var(--bad)} .d.dn{color:var(--good)}
.pays{padding:9px 12px 10px;border-bottom:1px solid var(--line);display:grid;gap:6px}
.pays .hd{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.pays .hd span:first-child{font:600 10px/1.2 var(--font-b);letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.stack{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--panel2);border:1px solid var(--line)}
.stack i{display:block;height:100%;min-width:0}
.keys{display:grid;grid-template-columns:1fr 1fr;gap:2px 10px;font-size:11.5px}
.keys span{display:flex;align-items:center;gap:6px;min-width:0}
.keys span b{margin-left:auto;font:500 11.5px var(--font-m)}
.keys i{width:9px;height:9px;border-radius:2px;flex:none}
.biz{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px 8px;padding:8px 12px 9px;border-bottom:1px solid var(--line);background:var(--panel2)}
.biz .s1{min-height:2.4em;font:600 9.5px/1.2 var(--font-b);letter-spacing:.07em;text-transform:uppercase;color:var(--mut)}
.biz .s2{font:600 15px/1.25 var(--font-m);margin-top:1px;white-space:nowrap}
.biz .s3{font:10.5px/1.3 var(--font-m);color:var(--mut);min-height:14px}
.biz .bad{color:var(--bad)}
.tabs{display:flex;border-bottom:1px solid var(--line);background:var(--panel2)}
.tab{flex:1;border:0;background:none;padding:9px 6px;font-weight:600;font-size:13px;color:var(--mut);border-bottom:2px solid transparent}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);background:var(--panel)}
.tabbody{flex:1;min-height:0;overflow:auto;padding:12px;display:grid;gap:14px;align-content:start}
.sec{display:grid;gap:8px}
.sec h4{font:600 10.5px/1 var(--font-b);letter-spacing:.09em;text-transform:uppercase;color:var(--mut)}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--panel);padding:5px 11px;font-size:12.5px;font-weight:500;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.pal{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pal button{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 8px;text-align:left;min-width:0}
.pal button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.pal .sw{width:12px;height:12px;border-radius:50%;flex:none;border:2px solid var(--ring);box-shadow:0 0 0 1px var(--line)}
.pal .nm{display:block;font-weight:600;font-size:12.5px;line-height:1.2}
.pal .tv{display:block;font:11px var(--font-m);color:var(--mut)}
.presets{display:flex;flex-wrap:wrap;gap:6px}
.stat{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat div{background:var(--panel2);border-radius:8px;padding:7px 9px}
.stat .s1{font:600 10px/1.2 var(--font-b);letter-spacing:.07em;text-transform:uppercase;color:var(--mut)}
.stat .s2{font:600 16px/1.2 var(--font-m);margin-top:2px}
.mix{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--panel2)}
.mix i{display:block}
.sites{display:grid;gap:5px}
.site{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2px 9px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:6px 9px;background:var(--panel)}
.site[data-sel="1"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.site .nm{font-weight:600;font-size:13px;text-align:left;border:0;background:none;padding:0;min-width:0;overflow-wrap:anywhere}
.site .tv{font:500 12.5px var(--font-m)}
.site .bar3{grid-column:2/4;height:5px;border-radius:3px;background:var(--panel2);overflow:hidden}
.site .bar3 i{display:block;height:100%;background:var(--accent)}
.site.off{opacity:.55}
.site input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent)}
.card{border:1px solid var(--line);border-radius:10px;padding:10px 11px;display:grid;gap:9px;background:var(--panel)}
.card h3{font:700 16px/1.2 var(--font-d)}
.card .meta{font-size:12px;color:var(--mut)}
.hz{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.hz div{background:var(--panel2);border-radius:7px;padding:5px 8px}
.hz .h1{font:600 9.5px/1.2 var(--font-b);letter-spacing:.07em;text-transform:uppercase;color:var(--mut)}
.hz .h2{font:500 13.5px var(--font-m);margin-top:1px}
.terms{display:grid;gap:8px;border-top:1px dashed var(--line);padding-top:9px}
.terms .sl{grid-template-columns:7.5em minmax(0,1fr) 5em}
.terms input[type=number]{width:100%;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:3px 6px;font:500 12.5px var(--font-m)}
.terms select{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:3px 6px;font-size:12.5px;min-width:0;max-width:100%}
.limrow{display:grid;grid-template-columns:7.5em minmax(0,1fr) auto;gap:8px;align-items:center;font-size:12.5px}
.empty{border:1px dashed var(--line);border-radius:10px;padding:12px;color:var(--mut);font-size:13px}
.note{font-size:12.5px;color:var(--mut)}
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{font:10.5px var(--font-m);fill:var(--mut)}
.chart .ax{stroke:var(--line);stroke-width:1;fill:none}
.chart .gl{stroke:var(--line2);stroke-width:1}
.chart .lab{fill:var(--ink);font-weight:500}
.chart .ttl{font:10.5px var(--font-b);fill:var(--mut)}
.vt{display:grid;gap:5px}
.vt .r{display:grid;grid-template-columns:7.2em minmax(0,1fr) 3.6em;gap:8px;align-items:center;font-size:12.5px}
.vt .tr{height:9px;border-radius:5px;background:var(--panel2);overflow:hidden}
.vt .tr i{display:block;height:100%}
.vt .pc{font:500 12px var(--font-m);text-align:right}
.tl{display:grid;gap:6px}
.tl .r{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:baseline;font-size:12.5px}
.tl .r .tr{grid-column:1/3;height:6px;border-radius:3px;background:var(--panel2);overflow:hidden}
.tl .r .tr i{display:block;height:100%;background:var(--accent)}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{font:600 10px/1.2 var(--font-b);letter-spacing:.07em;text-transform:uppercase;color:var(--mut);text-align:right;padding:3px 4px;border-bottom:1px solid var(--line)}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td{padding:4px;text-align:right;font-family:var(--font-m);font-variant-numeric:tabular-nums;border-bottom:1px solid var(--line2)}
.split{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--panel2)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

@media (max-width:900px){
  html,body{height:auto}
  #app{height:auto;display:flex;flex-direction:column}
  .guide{grid-template-columns:1fr}
  .guide .hide{position:absolute;top:10px;right:12px}
  .guide h2{padding-right:56px}
  .stage{display:flex;flex-direction:column}
  .mapwrap{flex:none;height:min(72vw,440px);min-height:240px}
  .panel{overflow:visible}
  .tabbody{overflow:visible}
  .sliders{grid-template-columns:1fr}
}
@media (max-width:520px){.biz{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div id="app">
  <header class="bar">
    <div class="brand">
      <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><path d="M5 17c-1-5 3-10 8-11 4-1 5 1 9 1s6 3 4 8-3 6-7 7-6 0-9-1-4-2-5-4z" fill="currentColor" opacity=".18" stroke="currentColor" stroke-width="1.6"/><path d="M2 8c3 0 3-2 6-2M2 12c2 0 3-1 5-1" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round"/></svg>
      <div><h1>Calder Island</h1><p>Catastrophe modelling introduction</p></div>
    </div>
    <nav class="steps" id="steps" aria-label="Training steps"></nav>
    <div class="nav"><button class="btn" id="back">Back</button><button class="btn primary" id="next">Next</button></div>
  </header>

  <section class="guide" id="guide" aria-live="polite"></section>

  <main class="stage">
    <section class="mapcol">
      <div class="layers" id="layers" role="group" aria-label="Map layers"></div>
      <div class="mapwrap" id="mapwrap">
        <canvas id="map" aria-label="Map of Calder Island with insured buildings and hazard layers"></canvas>
        <div class="tip" id="tip" hidden></div>
        <div class="toast" id="toast" hidden></div>
        <div class="evtag" id="evtag" hidden></div>
        <div class="legend" id="legend"></div>
      </div>
      <div class="scn" id="scn"></div>
      <div class="scn" id="comp" hidden></div>
    </section>

    <aside class="panel">
      <div class="kpis" id="kpis"></div>
      <div class="pays" id="pays"></div>
      <div class="biz" id="biz" hidden></div>
      <div class="tabs" role="tablist" id="tabs">
        <button class="tab" role="tab" data-tab="exposure">Exposure</button>
        <button class="tab" role="tab" data-tab="vuln">Vulnerability</button>
        <button class="tab" role="tab" data-tab="results">Results</button>
      </div>
      <div class="tabbody" id="tabbody" role="tabpanel"></div>
    </aside>
  </main>
</div>

<script>
/*ENGINE_START*/

    notice() { const T = TYPES.timber, a = dmgW(T, 30), b = dmgW(T, 45); return `A timber house loses <b>${pct(a)}</b> of its value at 30 m/s and <b>${pct(b)}</b> at 45 m/s. That is 50% more wind and <b>${(b / a).toFixed(1)}×</b> the damage.`; } },
  { name: 'Financial', title: 'Financial terms: who pays for the damage?',
    lede: 'Ground-up loss is what the damage costs. The policy then decides how much reaches the insurer: the deductible comes off first, then the limit applies, then the participation share.',
    chips: [['cap-port', 'Cap Calder Port at 30m'], ['part-port', 'Port participation 80%'], ['reset-all', 'Reset all terms']],
    tries: ['Select Calder Port, then use the chips above or the sliders in the Exposure tab.', 'Watch the Who-pays bar and the deltas on the three headline figures.', 'Pin the curve in Results, change a term, and compare.'],
    setup() { if (ST.scn === 'none') ST.scn = 'aurora'; ST.pos = 1; setLayers({ relief: true, susc: false, wind: false, ls: false, dmg: true, conc: false }); ST.sel = SITES[0].id; ST.scope = 'one'; switchTab('exposure'); },
    notice() { if (!EV) return 'Pick an event under the map.'; return `Ground-up loss <b>${fm(SC.gu)}</b>. The insurer pays <b>${fm(SC.ins)}</b> (${pct(SC.gu ? SC.ins / SC.gu : 0)}). Policy terms push <b>${fm(SC.gu - SC.ins)}</b> back to the clients.`; } }
];
const signed = x => (x >= 0 ? '+' : '−') + fm(Math.abs(x));
const chg = (n, o) => (o > 0 ? (Math.abs(n / o - 1) < 0.005 ? 'unchanged' : ((n / o - 1) >= 0 ? '+' : '−') + (Math.abs(n / o - 1) * 100).toFixed(0) + '%') : '–');
STEPS.push(
  { phase: 2, name: 'Accumulation', title: 'Accumulation: when value piles up in one place',
    lede: 'Calder Port and the Marram Refinery sit two kilometres apart, so one storm can reach both. The tail of the loss curve is set by that pile of value, not by the many small risks around it.',
    chips: [['cap-pr', 'Cap port and refinery at 40m each'], ['cap-3', 'Cap all three west sites at 40m'], ['reset-all', 'Reset all terms']],
    tries: ['Switch on Value concentration and find the peak 5 km cell.', 'Apply a cap with the chips, then open Results and compare the 1-in-100 with the dashed starting curve.', 'Weigh the tail loss the cap removes against the premium it gives up.'],
    setup() { loadBookSync('west'); resetTermsAll(); restoreComp(); ST.scn = 'aurora'; ST.pos = 1; ST.tab = 'results'; ST.sel = null; ST.pinNext = true; setLayers({ relief: true, susc: false, wind: true, ls: false, dmg: false, conc: true }); },
    notice() { const g = concGrid(), p = ST.pinned && ST.pinned.kpi; let t = `The busiest 5 km cell holds <b>${fm(g.mx)}</b>, ${pct(KPI.tiv ? g.mx / KPI.tiv : 0)} of the book. A 1-in-100 year loss is <b>${(KPI.rp100 / KPI.prem).toFixed(1)}×</b> the premium.`; if (p) t += ` Since the start: 1-in-100 <b>${signed(KPI.rp100 - p.rp100)}</b>, premium <b>${signed(KPI.prem - p.prem)}</b>.`; return t; } },
  { phase: 2, name: 'Diversification', title: 'Diversification: does a bigger book mean a bigger tail?',
    lede: 'Storms arrive from the west, so a west coast book suffers its worst losses together. Risks on the east coast add value that rarely takes damage in the same event.',
    chips: [['add-east', '+ 35 east coast risks'], ['book-west', 'Back to the west coast book']],
    tries: ['Add the east coast risks and read the changes against the starting point.', 'Open Results: the dashed curve is where you started, the solid one is now.', 'Run Storm Aurora, then Southern gale, and see which buildings are hit.'],
    setup() { loadBookSync('west'); resetTermsAll(); restoreComp(); ST.scn = 'aurora'; ST.pos = 1; ST.tab = 'results'; ST.sel = null; ST.pinNext = true; setLayers({ relief: true, susc: false, wind: true, ls: false, dmg: false, conc: false }); },
    notice() { const p = ST.pinned && ST.pinned.kpi; if (!p) return 'Add risks to see how the book changes.'; return `Since the start: TIV <b>${chg(KPI.tiv, p.tiv)}</b>, average annual loss <b>${chg(KPI.aal, p.aal)}</b>, 1-in-100 <b>${chg(KPI.rp100, p.rp100)}</b>. Loss cost moved from <b>${pct2(p.aal / p.tiv)}</b> to <b>${pct2(KPI.aal / KPI.tiv)}</b> of TIV.`; } },
  { phase: 2, name: 'Adverse selection', title: 'Adverse selection: a competitor maps the landslide risk',
    lede: 'We charge one flat rate. A competitor with a landslide map quotes the safe-zone risks cheaper, so those leave and the slide-prone ones stay. The book gets worse without a claim being paid.',
    chips: [['comp-30', 'Competitor takes 30%'], ['risk-on', 'We price by landslide risk too'], ['comp-0', 'Reset']],
    tries: ['Drag the competitor slider: dashed rings mark the risks that leave first.', 'Compare the premium lost with the expected loss lost.', 'Tick “We price by landslide risk too” and watch the loss ratio hold.'],
    setup() { loadBookSync('west'); resetTermsAll(); restoreComp(); ST.scn = 'rain'; ST.pos = 1; ST.tab = 'results'; ST.sel = null; ST.pinNext = true; setLayers({ relief: true, susc: true, wind: false, ls: true, dmg: false, conc: false }); },
    notice() { const p = ST.pinned && ST.pinned.kpi, gone = B.filter(b => b.gone).length, sm = B.filter(b => !b.site).length; if (!p) return ''; const lr = KPI.aal / KPI.prem; if (!gone) return 'Every risk pays the same rate on its value. Today the book earns about <b>' + pct(lr) + '</b> loss ratio. Now let a competitor in.'; return `<b>${gone}</b> of ${sm} small risks have left. Premium <b>${signed(KPI.prem - p.prem)}</b>, expected loss <b>${signed(KPI.aal - p.aal)}</b>. Loss ratio <b>${pct(lr)}</b> (was ${pct(p.lr)}).${ST.riskPrice ? ' Risk-based pricing keeps premium in step with expected loss.' : ''}`; } }
);
function buildSteps() {
  const chip = (s, i) => `<button class="step ${i < ST.step ? 'done' : ''}" data-step="${i}" ${i === ST.step ? 'aria-current="step"' : ''}><span class="n">${i + 1}</span>${s.name}</button>`;
  $('#steps').innerHTML = `<span class="phase">Phase 1 · Mechanics</span>` + STEPS.map((s, i) => s.phase === 2 ? '' : chip(s, i)).join('') + `<span class="phase gap">Phase 2 · Applications</span>` + STEPS.map((s, i) => s.phase === 2 ? chip(s, i) : '').join('');
  $('#back').disabled = ST.step === 0; $('#next').disabled = ST.step === STEPS.length - 1;
}
function renderGuide() {
  const s = STEPS[ST.step], g = $('#guide'); g.dataset.c = ST.collapsed ? '1' : '0';
  g.innerHTML = `<div><h2>${s.title}</h2><p class="lede">${s.lede}</p>${s.chips ? `<div class="chips-inline">${s.chips.map(c => `<button class="chip" data-act="${c[0]}">${c[1]}</button>`).join('')}</div>` : ''}</div>
    <div class="try"><h3>Try</h3><ul>${s.tries.map(t => `<li>${t}</li>`).join('')}</ul></div>
    <div class="notice-wrap"><h3>Notice</h3><p class="notice" id="notice"></p></div>
    <button class="btn sm hide" data-act="toggle-guide">${ST.collapsed ? 'Show' : 'Hide'}</button>`;
  updateNotice();
}
function updateNotice() { const n = $('#notice'); if (n && KPI.tiv != null) n.innerHTML = STEPS[ST.step].notice(); }
function renderGuideNotice() { updateNotice(); }
function renderBiz() {
  const el = $('#biz'), s = STEPS[ST.step]; if (!el) return; if (s.phase !== 2 || !KPI.prem) { el.hidden = true; return; }
  el.hidden = false; const p = ST.pinned && ST.pinned.kpi, lr = KPI.aal / KPI.prem, was = (v, f) => p && Math.abs(v - f) > 0.005 ? 'was ' + fv(f) : '';
  const cell = (k, v, w, cls) => `<div><div class="s1">${k}</div><div class="s2 ${cls || ''}">${v}</div><div class="s3">${w || ''}</div></div>`;
  const gone = B.filter(b => b.gone).length, sm = B.filter(b => !b.site).length;
  const c1 = cell(KPI.flat ? 'Premium · flat rate' : 'Premium · risk-based', fm(KPI.prem), p ? was(KPI.prem, p.prem) : (KPI.flat ? (ST.flatRate * 100).toFixed(2) + '% of TIV' : ''));
  const c2 = cell('Expected loss', fm(KPI.aal), p ? was(KPI.aal, p.aal) : '');
  const c3 = cell('Loss ratio', pct(lr), p && Math.abs(lr - p.lr) > 0.005 ? 'was ' + pct(p.lr) : '', lr > 0.85 ? 'bad' : '');
  let c4; if (ST.step === 4) c4 = cell('1-in-100 ÷ premium', (KPI.rp100 / KPI.prem).toFixed(1) + '×', p ? 'was ' + (p.rp100 / p.prem).toFixed(1) + '×' : '');
  else if (ST.step === 5) c4 = cell('1-in-100 ÷ TIV', pct(KPI.rp100 / KPI.tiv), p ? 'was ' + pct(p.rp100 / p.tiv) : '');
  else c4 = cell('Risks lost', gone + ' of ' + sm, gone ? pct(gone / sm) + ' of small risks' : '');
  el.innerHTML = c1 + c2 + c3 + c4;
}
function buildComp() {
  $('#comp').innerHTML = `<div class="scn-top"><span class="lbl">Competitor</span><span class="note">Prices landslide risk by location and takes the safest small risks first.</span></div>
  <div class="sliders"><div class="sl"><label for="compR">Share taken</label><input id="compR" type="range" min="0" max="60" step="5" value="${ST.comp * 100}"><span class="v" id="compV"></span></div>
  <div class="row"><label class="note"><input type="checkbox" id="riskP" ${ST.riskPrice ? 'checked' : ''}> We price by landslide risk too</label><button class="btn sm" id="reprice">Re-price flat rate</button></div></div>`;
  syncComp();
}
function syncComp() { const r = $('#compR'); if (!r) return; r.value = ST.comp * 100; $('#compV').textContent = (ST.comp * 100).toFixed(0) + '%'; $('#riskP').checked = ST.riskPrice; $('#reprice').disabled = ST.comp === 0 || ST.riskPrice; }
function goStep(i) {
  ST.playing = false; ST.step = clamp(i, 0, STEPS.length - 1); if (ST.step !== 6) restoreComp(); STEPS[ST.step].setup(); buildSteps(); renderGuide(); buildScn(); buildComp(); $('#comp').hidden = ST.step !== 6;
  $$('#tabs .tab').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === ST.tab))); buildTab(); refresh('all'); refresh('scn');
}

// ---------- actions (delegated) ----------
function doAct(a) {
  if (a === 'book-west') loadBook('west'); else if (a === 'book-div') loadBook('div'); else if (a === 'add-east') addEast(); else if (a === 'clear') clearSmall();
  else if (a === 'reset-terms') { const s = getSel(); if (s) setTermsFor(scopeTargets(s), { ded: 0.01, lim: null, part: 1 }); }
  else if (a === 'cap-port') { ST.sel = SITES[0].id; ST.scope = 'one'; if (ST.tab !== 'exposure') switchTab('exposure'); setTermsFor([SITES[0]], { lim: 30 }); }
  else if (a === 'part-port') { ST.sel = SITES[0].id; ST.scope = 'one'; if (ST.tab !== 'exposure') switchTab('exposure'); setTermsFor([SITES[0]], { part: 0.8 }); }
  else if (a === 'reset-all') setTermsFor(B, { ded: 0.01, lim: null, part: 1 });
  else if (a === 'cap-pr') { ST.sel = SITES[0].id; ST.scope = 'one'; setTermsFor([SITES[0], SITES[1]], { lim: 40 }); }
  else if (a === 'cap-3') { ST.sel = SITES[0].id; ST.scope = 'one'; setTermsFor([SITES[0], SITES[1], SITES[2]], { lim: 40 }); }
  else if (a === 'comp-30') { beginChange(); ST.comp = 0.3; syncComp(); refresh('all'); }
  else if (a === 'comp-0') { beginChange(); ST.comp = 0; ST.riskPrice = false; ST.flatRate = null; syncComp(); refresh('all'); }
  else if (a === 'risk-on') { beginChange(); ST.riskPrice = true; syncComp(); refresh('all'); }
  else if (a === 'pin') { pinCurve(); updateResults(); renderBiz(); updateNotice(); } else if (a === 'unpin') { ST.pinned = null; updateResults(); }
  else if (a === 'toggle-guide') { ST.collapsed = !ST.collapsed; renderGuide(); }
}
document.addEventListener('click', e => {
  const t = e.target.closest('button,input'); if (!t) return;
  if (t.dataset.act) doAct(t.dataset.act);
  else if (t.dataset.step != null) goStep(+t.dataset.step);
  else if (t.dataset.tab) switchTab(t.dataset.tab);
  else if (t.dataset.layer) setLayers({ [t.dataset.layer]: !ST.layers[t.dataset.layer] });
  else if (t.dataset.scn) setScn(t.dataset.scn);
  else if (t.dataset.tool) { ST.tool = t.dataset.tool; updateExposure(); }
  else if (t.dataset.type) { ST.type = t.dataset.type; ST.tool = 'place'; updateExposure(); }
  else if (t.dataset.n) { ST.cluster = +t.dataset.n; updateExposure(); }
  else if (t.dataset.pick) selectB(+t.dataset.pick);
  else if (t.dataset.vt) { ST.vtype = t.dataset.vt; updateVuln(); }
  else if (t.dataset.peril) { ST.vperil = t.dataset.peril; updateVuln(); }
  else if (t.id === 'reprice') { beginChange(); ST.flatRate = flatRateOf(B, PF); refresh('all'); }
  else if (t.id === 'play') { if (ST.playing) { ST.playing = false; } else { if (ST.pos >= 0.999) ST.pos = 0; ST.playing = true; lastT = performance.now(); requestAnimationFrame(tick); } updateScnReadout(); }
  else if (t.dataset.site) { beginChange(); const b = B.find(x => x.id === +t.dataset.site); if (b) { b.inc = t.checked; b.on = b.inc && !b.gone; } refresh('all'); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'compR') { beginChange(); ST.comp = +t.value / 100; syncComp(); refresh('all'); }
  else if (t.id === 'inten') { beginChange(); ST.inten = +t.value / 100; refresh('scn'); }
  else if (t.id === 'posR') { ST.pos = +t.value / 100; ST.playing = false; buildFootprints(); updateScnReadout(); dirty = true; }
  else if (t.id === 'tDed') setTerms({ ded: +t.value / 100 });
  else if (t.id === 'tPart') setTerms({ part: +t.value / 100 });
  else if (t.id === 'tLim') { const v = +t.value; if (v > 0) setTerms({ lim: v }); }
  else if (t.id === 'vTest') { ST.test[ST.vperil] = +t.value; updateVuln(); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'riskP') { beginChange(); ST.riskPrice = t.checked; syncComp(); refresh('all'); }
  else if (t.id === 'tNoLim') { const s = getSel(); if (!s) return; $('#tLim').disabled = t.checked; setTerms({ lim: t.checked ? null : (+$('#tLim').value || Math.round(s.tiv * 0.5)) }); }
  else if (t.id === 'tScope') { ST.scope = t.value; }
});
$('#back').addEventListener('click', () => goStep(ST.step - 1));
$('#next').addEventListener('click', () => goStep(ST.step + 1));

// ---------- start-up ----------
function onTheme() { readTheme(); if (gS) { buildRelief(); } renderLegend(); dirty = true; }
function init() {
  readTheme(); buildCoast(); resize(); new ResizeObserver(resize).observe(wrap);
  buildLayers(); buildSteps(); renderGuide(); buildScn(); buildComp(); $$('#tabs .tab').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === ST.tab)));
  tabbody.innerHTML = '<div class="empty">Building the island and its 3,000-event hazard set…</div>';
  setTimeout(() => {
    buildFields(); buildRelief();
    SITES = siteDefs().map(s => addB({ name: s.name, type: s.type, tiv: s.tiv, x: s.x, y: s.y, site: true, kind: s.kind, note: s.note }));
    for (const s of scatter(['west'], 60, 11, B)) addB(s);
    ready = true; STEPS[0].setup(); calcScenario(); recompute(); buildTab(); buildFootprints(); renderKPIs(); renderPays(); renderBiz(); updateScnReadout(); updateNotice(); renderLegend(); dirty = true;
  }, 40);
  const mq = window.matchMedia('(prefers-color-scheme: dark)'); if (mq.addEventListener) mq.addEventListener('change', onTheme);
  new MutationObserver(onTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  requestAnimationFrame(loop);
}
init();
})();

</script>
